<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Supabase Migration Smoke Test</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px}
    .wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(15,23,42,.05)}
    input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1}input{width:calc(100% - 26px);margin:5px 0 10px}button{cursor:pointer;background:#0f766e;color:#fff;border:0;margin-right:8px}.muted{color:#64748b;font-size:13px}.ok{color:#047857}.bad{color:#b91c1c}pre{white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">
  <h2>Supabase Migration Smoke Test</h2>
  <p class="muted">หน้าทดสอบแยกจากระบบ Production ยังไม่เปลี่ยน backend ของหน้าเว็บหลัก</p>

  <div class="card">
    <h3>1. Public dashboard</h3>
    <button onclick="testPublic()">ทดสอบ Public RPC</button>
    <pre id="publicOut">ยังไม่ได้ทดสอบ</pre>
  </div>

  <div class="card">
    <h3>2. เจ้าหน้าที่เข้าสู่ระบบ</h3>
    <label>อีเมล</label><input id="email" type="email" autocomplete="username">
    <label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password">
    <button onclick="login()">เข้าสู่ระบบทดสอบ</button>
    <button onclick="logout()" style="background:#475569">ออกจากระบบ</button>
    <pre id="authOut">ยังไม่ได้เข้าสู่ระบบ</pre>
  </div>

  <div class="card">
    <h3>3. RLS / Data access</h3>
    <button onclick="testPrivate()">ทดสอบสิทธิ์และจำนวนข้อมูล</button>
    <pre id="privateOut">ยังไม่ได้ทดสอบ</pre>
  </div>
</div>
<script src="supabase-adapter.js?v=phase3-staging-1"></script>
<script>
const fmt=x=>JSON.stringify(x,null,2);
async function testPublic(){const el=document.getElementById('publicOut');try{const d=await MedDeviceSupabase.getPublicDashboard();el.textContent=fmt(d);el.className='ok';}catch(e){el.textContent=e.message;el.className='bad';}}
async function login(){const el=document.getElementById('authOut');try{const d=await MedDeviceSupabase.signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);el.textContent=fmt({admin_id:d.profile.admin_id,display_name:d.profile.display_name,role:d.profile.role,active:d.profile.active});el.className='ok';document.getElementById('password').value='';}catch(e){el.textContent=e.message;el.className='bad';}}
async function logout(){await MedDeviceSupabase.signOut().catch(()=>{});document.getElementById('authOut').textContent='ออกจากระบบแล้ว';}
async function testPrivate(){const el=document.getElementById('privateOut');try{const [p,e,b]=await Promise.all([MedDeviceSupabase.getMyProfile(),MedDeviceSupabase.listEquipments(),MedDeviceSupabase.listBorrowLogs(500)]);el.textContent=fmt({profile:{admin_id:p.admin_id,role:p.role,active:p.active},equipment_count:e.length,borrow_log_count:b.length});el.className='ok';}catch(e){el.textContent=e.message;el.className='bad';}}
testPublic();
</script>
</body>
</html>
