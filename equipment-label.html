<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>พิมพ์สติ๊กเกอร์อุปกรณ์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,sans-serif;background:#f4f7fb;color:#1f2937}.page{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;max-width:1300px;margin:auto;padding:20px}.panel{background:white;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.preview-panel{min-height:80vh;padding:24px;display:flex;align-items:center;justify-content:center;overflow:auto}.control-panel{padding:20px;align-self:start;position:sticky;top:16px}.control-panel h1{font-size:18px;margin:0 0 4px}.muted{font-size:12px;color:#94a3b8}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.field label{font-size:11px;font-weight:700;color:#64748b;display:block;margin-bottom:5px}.field input{width:100%;border:1px solid #dbe1e8;border-radius:10px;padding:9px;font-size:14px}.toggles{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggles label{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:9px;font-size:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.buttons button{border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:white}.secondary{background:#eef2ff;color:#3730a3}.print{background:#059669;color:white}.reset{background:#f1f5f9;color:#334155}.status{margin-top:12px;font-size:11px;color:#64748b}.label-shell{display:flex;align-items:center;justify-content:center}.label{width:90mm;height:70mm;background:white;border:1px dashed #94a3b8;padding:3mm;display:grid;grid-template-columns:1fr 25mm;grid-template-rows:auto auto 1fr auto;column-gap:3mm;overflow:hidden;box-shadow:0 6px 22px rgba(15,23,42,.12);font-size:3.2mm}.brand{grid-column:1/3;display:flex;align-items:center;gap:2.8mm;min-height:15mm;padding-bottom:1.6mm;border-bottom:.45mm solid #1d4f91}.brand img{width:13mm;height:13mm;object-fit:contain;border-radius:50%;flex:0 0 13mm}.brand-copy{min-width:0;line-height:1.08}.system-title{font-size:2.55mm;font-weight:700;color:#334155;margin-bottom:.7mm}.brand-title{font-weight:800;font-size:3.65mm;line-height:1.12;color:#123f7a;white-space:normal;overflow:visible}.brand-sub{font-size:3.35mm;font-weight:800;line-height:1.1;color:#123f7a;margin-top:.65mm}.eq-name{grid-column:1/3;font-weight:800;font-size:4.9mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1.8mm}.meta{font-size:3.15mm;line-height:1.4;overflow:hidden}.meta b{font-size:4.1mm}.barcode-wrap{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}.barcode-wrap svg{width:100%;height:14.5mm}.qr-wrap{grid-column:2;grid-row:3/5;display:flex;align-items:center;justify-content:center}.qr-wrap>div{width:22mm;height:22mm}.qr-wrap img,.qr-wrap canvas{width:22mm!important;height:22mm!important}.footer{grid-column:1;font-size:2.55mm;color:#475569;align-self:end}.hidden{display:none!important}
@media(max-width:800px){.page{grid-template-columns:1fr;padding:10px}.control-panel{position:static}.preview-panel{min-height:52vh}.label{transform-origin:center}.toggles{grid-template-columns:1fr 1fr}}
@media print{body{background:white}.page{display:block;padding:0;margin:0;max-width:none}.control-panel{display:none!important}.preview-panel{padding:0;border:0;box-shadow:none;min-height:auto}.label-shell{display:block}.label{border:0;box-shadow:none;margin:0}}
</style>
</head>
<body>
<div class="page">
  <div class="panel preview-panel"><div class="label-shell"><div id="label" class="label">
    <div id="brand" class="brand"><img id="logo" src="assets/logo.png"><div class="brand-copy"><div class="system-title">ระบบบริหารจัดการ ยืมคืนอุปกรณ์การแพทย์</div><div id="agencyTitle" class="brand-title">ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง</div><div id="agencySub" class="brand-sub">เทศบาลเมืองเขลางค์นคร</div></div></div>
    <div id="eqName" class="eq-name">กำลังโหลด...</div>
    <div class="meta"><b id="eqCode">-</b><br><span id="serial">Serial: -</span></div>
    <div id="qrWrap" class="qr-wrap"><div id="qr"></div></div>
    <div id="barcodeWrap" class="barcode-wrap"><svg id="barcode"></svg></div>
    <div class="footer">สแกน QR เพื่อดูข้อมูลและประวัติเครื่อง</div>
  </div></div></div>
  <div class="panel control-panel">
    <h1>พิมพ์สติ๊กเกอร์อุปกรณ์</h1><div class="muted">มาตรฐานเริ่มต้น 90 × 70 mm · ปรับขนาดก่อนพิมพ์ได้</div>
    <div class="form-grid">
      <div class="field"><label>กว้าง (mm)</label><input id="widthMm" type="number" min="20" max="200" step="1" value="90"></div>
      <div class="field"><label>สูง (mm)</label><input id="heightMm" type="number" min="15" max="150" step="1" value="70"></div>
      <div class="field"><label>ขนาดตัวอักษร</label><input id="fontScale" type="number" min="0.6" max="2" step="0.1" value="1"></div>
      <div class="field"><label>จำนวนสำเนา</label><input id="copies" type="number" min="1" max="20" step="1" value="1"></div>
    </div>
    <div class="toggles">
      <label><input id="showLogo" type="checkbox" checked> โลโก้</label>
      <label><input id="showAgency" type="checkbox" checked> ชื่อหน่วยงาน</label>
      <label><input id="showSerial" type="checkbox" checked> Serial</label>
      <label><input id="showBarcode" type="checkbox" checked> Barcode</label>
      <label><input id="showQr" type="checkbox" checked> QR Code</label>
    </div>
    <div class="buttons">
      <button class="reset" onclick="resetSize()">90 × 70 mm</button>
      <button class="secondary" onclick="saveSettings()">บันทึกขนาด</button>
      <button class="primary" onclick="applyPreview()">ดูตัวอย่าง</button>
      <button class="print" onclick="printLabel()">พิมพ์สติ๊กเกอร์</button>
    </div>
    <div id="status" class="status">กำลังโหลดข้อมูลอุปกรณ์...</div>
  </div>
</div>
<script>
const API='https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api-v60';const code=new URLSearchParams(location.search).get('code')||'';let payloadData=null;
async function run(action,payload={}){const token=localStorage.getItem('medDevice.adminToken')||'';if(token)payload.token=token;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload})});return await r.json();}
function checked(id){return document.getElementById(id).checked}function num(id,d){const v=Number(document.getElementById(id).value);return Number.isFinite(v)?v:d}
function applyPreview(){if(!payloadData)return;const s={widthMm:num('widthMm',90),heightMm:num('heightMm',70),fontScale:num('fontScale',1),showLogo:checked('showLogo'),showAgency:checked('showAgency'),showSerial:checked('showSerial'),showBarcode:checked('showBarcode'),showQr:checked('showQr')};const label=document.getElementById('label');label.style.width=s.widthMm+'mm';label.style.height=s.heightMm+'mm';label.style.fontSize=(3.2*s.fontScale)+'mm';document.getElementById('logo').classList.toggle('hidden',!s.showLogo);document.getElementById('agencyTitle').classList.toggle('hidden',!s.showAgency);document.getElementById('agencySub').classList.toggle('hidden',!s.showAgency);document.getElementById('serial').classList.toggle('hidden',!s.showSerial);document.getElementById('barcodeWrap').classList.toggle('hidden',!s.showBarcode);document.getElementById('qrWrap').classList.toggle('hidden',!s.showQr);renderCodes();document.getElementById('status').textContent=`ตัวอย่าง ${s.widthMm} × ${s.heightMm} mm`}
function renderCodes(){if(!payloadData)return;const d=payloadData;try{JsBarcode('#barcode',d.equipment.equipmentCode,{format:'CODE128',displayValue:true,fontSize:14,height:38,margin:0});}catch(e){}const q=document.getElementById('qr');q.innerHTML='';try{new QRCode(q,{text:d.qrUrl,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
async function load(){if(!code){document.getElementById('status').textContent='ไม่พบรหัสอุปกรณ์';return}const r=await run('getEquipmentLabelData',{equipmentCode:code});if(!r.success){document.getElementById('status').textContent=r.error||'โหลดไม่สำเร็จ';Swal.fire('เปิดไม่ได้',r.error||'กรุณาเข้าสู่ระบบก่อน','error');return}payloadData=r.data;const e=r.data.equipment,s=r.data.labelSettings||{};document.getElementById('eqName').textContent=e.equipmentName;document.getElementById('eqCode').textContent=e.equipmentCode;document.getElementById('serial').textContent='Serial: '+(e.serialNumber||'-');document.getElementById('agencyTitle').textContent='ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง';document.getElementById('agencySub').textContent='เทศบาลเมืองเขลางค์นคร';document.getElementById('logo').src=r.data.logoUrl||'assets/logo.png';document.getElementById('widthMm').value=s.width_mm||90;document.getElementById('heightMm').value=s.height_mm||70;document.getElementById('fontScale').value=s.font_scale||1;document.getElementById('showLogo').checked=s.show_logo!==false;document.getElementById('showAgency').checked=s.show_agency!==false;document.getElementById('showSerial').checked=s.show_serial!==false;document.getElementById('showBarcode').checked=s.show_barcode!==false;document.getElementById('showQr').checked=s.show_qr!==false;applyPreview()}
function resetSize(){document.getElementById('widthMm').value=90;document.getElementById('heightMm').value=70;document.getElementById('fontScale').value=1;applyPreview()}
async function saveSettings(){if(!payloadData)return;const r=await run('saveEquipmentLabelSettings',{equipmentCode:code,widthMm:num('widthMm',90),heightMm:num('heightMm',70),fontScale:num('fontScale',1),showLogo:checked('showLogo'),showAgency:checked('showAgency'),showSerial:checked('showSerial'),showBarcode:checked('showBarcode'),showQr:checked('showQr')});if(r.success)Swal.fire('บันทึกแล้ว','เก็บรูปแบบสติ๊กเกอร์ของเครื่องนี้แล้ว','success');else Swal.fire('ไม่สำเร็จ',r.error||'บันทึกไม่ได้','error')}
function printLabel(){applyPreview();const w=num('widthMm',90),h=num('heightMm',70),copies=Math.max(1,Math.min(20,num('copies',1)));let style=document.getElementById('dynamicPrint');if(!style){style=document.createElement('style');style.id='dynamicPrint';document.head.appendChild(style)}style.textContent=`@media print{@page{size:${w}mm ${h}mm;margin:0}.label{width:${w}mm!important;height:${h}mm!important;page-break-after:always}}`;const shell=document.querySelector('.label-shell');document.querySelectorAll('.print-copy').forEach(x=>x.remove());for(let i=1;i<copies;i++){const clone=document.getElementById('label').cloneNode(true);clone.classList.add('print-copy');clone.querySelector('#qr')?.replaceChildren();shell.appendChild(clone)};setTimeout(()=>window.print(),100)}
['widthMm','heightMm','fontScale','showLogo','showAgency','showSerial','showBarcode','showQr'].forEach(id=>document.getElementById(id).addEventListener('input',applyPreview));load();
</script>
<script src="equipment-label-enhance.js?v=6.2.2"></script>
</body></html>
