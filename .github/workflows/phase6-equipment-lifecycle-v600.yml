function phase6LabelHtml(data,settings,forPrint=false){
    const e=data.equipment||{},agency=escapeHtml(data.agencyTitle||'ศูนย์ยืมคืนกายอุปกรณ์'),sub=escapeHtml(data.agencySubtitle||''),code=escapeHtml(e.equipmentCode||''),name=escapeHtml(e.equipmentName||''),serial=escapeHtml(e.serialNumber||'');
    return `<div class="p6-label ${forPrint?'p6-label-print':''}" style="--p6-font:${Number(settings.font_scale||1)}"><div class="p6-label-head">${settings.show_logo!==false?`<img src="${escapeHtml(data.logoUrl||'assets/logo.png')}" class="p6-label-logo">`:''}<div class="p6-label-agency" style="display:${settings.show_agency===false?'none':'block'}"><b>${agency}</b>${sub?`<small>${sub}</small>`:''}</div></div><div class="p6-label-name">${name}</div><div class="p6-label-code">${code}${settings.show_serial!==false&&serial?` <span>• ${serial}</span>`:''}</div><div class="p6-label-codes"><svg class="p6-barcode" data-code="${code}" style="display:${settings.show_barcode===false?'none':'block'}"></svg><div class="p6-qr" data-qr="${escapeHtml(data.qrUrl||'')}" style="display:${settings.show_qr===false?'none':'block'}"></div></div><div class="p6-label-foot">สแกน QR เพื่อดูข้อมูลและประวัติเครื่อง</div></div>`;
}
function phase6RenderCodes(root=document){
    root.querySelectorAll('.p6-barcode').forEach(el=>{if(el.style.display==='none')return;try{JsBarcode(el,el.dataset.code||'',{format:'CODE128',displayValue:true,fontSize:11,height:32,margin:0})}catch(e){console.warn(e)}});
    root.querySelectorAll('.p6-qr').forEach(el=>{if(el.style.display==='none')return;el.innerHTML='';try{new QRCode(el,{text:el.dataset.qr||'',width:88,height:88,correctLevel:QRCode.CorrectLevel.M})}catch(e){console.warn(e)}});
}
