}
function phase6CurrentLabelSettings(){return {width_mm:Math.max(20,Math.min(200,Number(document.getElementById('p6l-w')?.value||75))),height_mm:Math.max(15,Math.min(150,Number(document.getElementById('p6l-h')?.value||50))),font_scale:Number(document.getElementById('p6l-font')?.value||1),show_logo:!!document.getElementById('p6l-logo')?.checked,show_agency:!!document.getElementById('p6l-agency')?.checked,show_serial:!!document.getElementById('p6l-serial')?.checked,show_barcode:!!document.getElementById('p6l-barcode')?.checked,show_qr:!!document.getElementById('p6l-qr')?.checked}}
function phase6UpdateLabelPreview(){const data=phase6State.labelData,box=document.getElementById('p6-label-preview');if(!data||!box)return;const s=phase6CurrentLabelSettings(),maxW=Math.min(650,s.width_mm*6),pxH=maxW*s.height_mm/s.width_mm;box.style.width=maxW+'px';box.style.height=pxH+'px';box.innerHTML=phase6LabelHtml(data,s);phase6RenderCodes(box)}
