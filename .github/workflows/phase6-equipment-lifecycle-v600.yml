e{width:67%;max-height:86%}.p6-label .p6-qr{width:28%;display:flex;align-items:center;justify-content:center}.p6-label .p6-qr img,.p6-label .p6-qr canvas{width:100%!important;height:auto!important;max-height:100%}.p6-label-foot{font-size:calc(7px * var(--p6-font,1));text-align:right;color:#6b7280}.p6-status-danger{color:#be123c!important}.p6-status-warn{color:#a16207!important}.p6-status-ok{color:#047857!important}.p6-status-orange{color:#c2410c!important}.p6-status-muted{color:#64748b!important}@media(max-width:767px){.p6-label-designer{grid-template-columns:1fr}.p6-label-preview-wrap{min-height:260px}.p6-icon-btn{width:40px;height:40px}.p6-btn{min-height:42px}.p6-form input,.p6-form select,.p6-form textarea{font-size:16px}}
