name: Phase 6 Equipment Lifecycle v6.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase6-equipment-lifecycle-v600.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 6 frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index=Path('index.html')
          h=index.read_text(encoding='utf-8')

          menu='''
                <button onclick="switchTab('lifecycle')" id="btn-menu-lifecycle" class="menu-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-all">
                    <i class="fa-solid fa-barcode text-lg text-emerald-600 w-6 text-center"></i>
                    <span class="menu-text transition-all duration-200">ประวัติ/บำรุงรักษา</span>
                    <span id="menu-badge-maintenance" class="menu-badge hidden">0</span>
                </button>
'''
          if 'btn-menu-lifecycle' not in h:
              marker='                <button onclick="switchTab(\'tracking\')"'
              if marker not in h: raise SystemExit('tracking menu marker not found')
              h=h.replace(marker,menu+marker,1)

          section='''
            <section id="sec-lifecycle" class="app-view space-y-6 hidden">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 print:hidden">
                    <div>
                        <h3 class="text-base font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-barcode text-emerald-600"></i> ทะเบียนอุปกรณ์และประวัติบำรุงรักษา</h3>
                        <p class="text-xs text-gray-400 mt-1">Equipment Lifecycle • Preventive Maintenance • Barcode / QR Label</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="loadPhase6Dashboard(true)" class="p6-btn"><i class="fa-solid fa-rotate"></i> รีเฟรช</button>
                        <button onclick="openPhase6PlanManager()" class="p6-btn admin-role-only"><i class="fa-solid fa-calendar-check"></i> ตั้งค่ารอบ PM</button>
                        <button onclick="phase6PrintBatch()" class="p6-btn"><i class="fa-solid fa-print"></i> พิมพ์สติ๊กเกอร์ที่เลือก</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="phase6-summary-grid">
                    <div class="p6-kpi"><span>อุปกรณ์</span><strong id="p6-kpi-total">0</strong></div>
                    <div class="p6-kpi p6-kpi-danger"><span>PM เกินกำหนด</span><strong id="p6-kpi-overdue">0</strong></div>
                    <div class="p6-kpi p6-kpi-warn"><span>PM ใกล้ครบ</span><strong id="p6-kpi-soon">0</strong></div>
                    <div class="p6-kpi p6-kpi-orange"><span>ครบตามการใช้งาน</span><strong id="p6-kpi-usage">0</strong></div>
                    <div class="p6-kpi p6-kpi-muted"><span>ยังไม่มีแผน PM</span><strong id="p6-kpi-noplan">0</strong></div>
                </div>

                <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
                        <div class="relative flex-1 max-w-xl"><i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-300"></i><input id="p6-search" oninput="renderPhase6Table()" class="w-full border border-gray-200 rounded-xl pl-9 pr-3 py-2.5 text-sm" placeholder="ค้นหารหัส ชื่อ หรือ Serial Number"></div>
                        <select id="p6-maint-filter" onchange="renderPhase6Table()" class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm"><option value="ALL">ทุกสถานะ PM</option><option value="OVERDUE">เกินกำหนด</option><option value="DUE_SOON">ใกล้ครบ</option><option value="DUE_USAGE">ครบตามการใช้งาน</option><option value="OK">ปกติ</option><option value="NO_PLAN">ไม่มีแผน</option></select>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-sm">
                            <thead class="bg-gray-50 text-gray-500 text-xs"><tr><th class="p-3 text-center"><input type="checkbox" onchange="phase6SelectAll(this.checked)"></th><th class="p-3 text-left">อุปกรณ์</th><th class="p-3 text-left">สถานะ</th><th class="p-3 text-center">ใช้งาน</th><th class="p-3 text-left">PM ล่าสุด</th><th class="p-3 text-left">PM ถัดไป</th><th class="p-3 text-left">สถานะ PM</th><th class="p-3 text-right">จัดการ</th></tr></thead>
                            <tbody id="phase6-equipment-rows" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>
            </section>
'''
          if 'id="sec-lifecycle"' not in h:
              marker='            <section id="sec-tracking"'
              if marker not in h: raise SystemExit('tracking section marker not found')
              h=h.replace(marker,section+'\n'+marker,1)

          # Add barcode / QR libraries once.
          if 'JsBarcode.all.min.js' not in h:
              h=h.replace('</body>','''    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>\n</body>''',1)

          h=re.sub(r'style\.css\?v=[0-9.]+','style.css?v=6.0.0',h)
          h=re.sub(r'script\.js\?v=[0-9.]+','script.js?v=6.0.0',h)
          h=re.sub(r'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v[0-9.]+ \|','ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v6.0.0 |',h)
          index.write_text(h,encoding='utf-8')

          script=Path('script.js')
          s=script.read_text(encoding='utf-8')
          s=re.sub(r'Frontend Controller API \(v[^)]*\)','Frontend Controller API (v6.0.0 Equipment Lifecycle & Labels)',s,count=1)
          s=s.replace('https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api-v52','https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api-v60',1)
          needle="    document.getElementById(`sec-${tabId}`).classList.remove('hidden');"
          if 'loadPhase6Dashboard();' not in s:
              if needle not in s: raise SystemExit('switchTab marker not found')
              s=s.replace(needle,needle+"\n    if (tabId === 'lifecycle') loadPhase6Dashboard();",1)

          phase6_js=r'''

// ============================================================================
// Phase 6 — Equipment Lifecycle / Preventive Maintenance / Barcode & QR Labels
// ============================================================================
const phase6State = { loaded:false, loading:false, items:[], summary:{}, profile:null, plans:[], selected:new Set(), labelData:null };
const P6_DATE = new Intl.DateTimeFormat('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});
function p6Date(v){ if(!v)return '-'; const d=new Date(String(v).length<=10?String(v)+'T12:00:00':v); return Number.isNaN(d.getTime())?'-':P6_DATE.format(d); }
function p6StateMeta(state){
    return ({OVERDUE:['เกินกำหนด','p6-status-danger','fa-triangle-exclamation'],DUE_SOON:['ใกล้ครบกำหนด','p6-status-warn','fa-clock'],DUE_USAGE:['ครบตามการใช้งาน','p6-status-orange','fa-gauge-high'],OK:['ปกติ','p6-status-ok','fa-circle-check'],NO_PLAN:['ไม่มีแผน PM','p6-status-muted','fa-minus-circle']})[state] || [state||'-','p6-status-muted','fa-circle'];
}
async function loadPhase6Dashboard(force=false){
    if(phase6State.loading || (phase6State.loaded&&!force)){ renderPhase6Table(); return; }
    phase6State.loading=true;
    const body=document.getElementById('phase6-equipment-rows'); if(body)body.innerHTML='<tr><td colspan="8" class="p-8 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังอ่านทะเบียนอุปกรณ์...</td></tr>';
    try{
        const r=await run('getEquipmentLifecycleDashboard');
        if(!r.success) throw new Error(r.error||'โหลดข้อมูลไม่สำเร็จ');
        phase6State.items=Array.isArray(r.items)?r.items:[]; phase6State.summary=r.summary||{}; phase6State.loaded=true;
        const q=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=String(v??0)};
        q('p6-kpi-total',phase6State.summary.total); q('p6-kpi-overdue',phase6State.summary.overdue); q('p6-kpi-soon',phase6State.summary.dueSoon); q('p6-kpi-usage',phase6State.summary.dueUsage); q('p6-kpi-noplan',phase6State.summary.noPlan);
        const badge=document.getElementById('menu-badge-maintenance'); const n=Number(phase6State.summary.overdue||0)+Number(phase6State.summary.dueSoon||0)+Number(phase6State.summary.dueUsage||0); if(badge){badge.textContent=String(n);badge.classList.toggle('hidden',!n)}
        renderPhase6Table();
    }catch(e){ if(body)body.innerHTML=`<tr><td colspan="8" class="p-8 text-center text-rose-500">${escapeHtml(e.message||String(e))}</td></tr>`; }
    finally{phase6State.loading=false;}
}
function renderPhase6Table(){
    const body=document.getElementById('phase6-equipment-rows'); if(!body)return;
    const q=String(document.getElementById('p6-search')?.value||'').trim().toLowerCase(); const f=document.getElementById('p6-maint-filter')?.value||'ALL';
    const rows=phase6State.items.filter(x=>(f==='ALL'||x.maintenanceState===f)&&(!q||[x.equipmentCode,x.equipmentName,x.serialNumber].some(v=>String(v||'').toLowerCase().includes(q))));
    if(!rows.length){body.innerHTML='<tr><td colspan="8" class="p-8 text-center text-gray-400">ไม่พบอุปกรณ์ตามเงื่อนไข</td></tr>';return;}
    body.innerHTML=rows.map(x=>{const [lab,cls,icon]=p6StateMeta(x.maintenanceState),code=escapeHtml(x.equipmentCode),js=escapeJsSingleQuoted(x.equipmentCode);return `<tr class="hover:bg-gray-50/60"><td class="p-3 text-center"><input type="checkbox" ${phase6State.selected.has(x.equipmentCode)?'checked':''} onchange="phase6ToggleSelect('${js}',this.checked)"></td><td class="p-3"><div class="font-bold text-gray-800">${escapeHtml(x.equipmentName)}</div><div class="text-xs text-gray-400">${code}${x.serialNumber?' • '+escapeHtml(x.serialNumber):''}</div></td><td class="p-3"><span class="text-xs font-semibold">${escapeHtml(x.status)}</span></td><td class="p-3 text-center"><b>${Number(x.borrowCount||0)}</b> ครั้ง</td><td class="p-3 text-xs">${p6Date(x.lastMaintenanceDate)}</td><td class="p-3 text-xs font-semibold">${p6Date(x.nextMaintenanceDate)}</td><td class="p-3"><span class="p6-status ${cls}"><i class="fa-solid ${icon}"></i> ${lab}</span>${x.maintenancePlan?`<div class="text-[10px] text-gray-400 mt-1">${escapeHtml(x.maintenancePlan)}</div>`:''}</td><td class="p-3"><div class="flex justify-end gap-1 flex-wrap"><button class="p6-icon-btn" title="ดูประวัติ" onclick="openPhase6Profile('${js}')"><i class="fa-solid fa-clock-rotate-left"></i></button><button class="p6-icon-btn" title="บันทึกบำรุงรักษา" onclick="openPhase6Maintenance('${js}')"><i class="fa-solid fa-screwdriver-wrench"></i></button><button class="p6-icon-btn" title="บันทึกชั่วโมงใช้งาน" onclick="openPhase6Meter('${js}')"><i class="fa-solid fa-gauge"></i></button><button class="p6-icon-btn" title="ออกบาร์โค้ด/สติ๊กเกอร์" onclick="openPhase6LabelDesigner('${js}')"><i class="fa-solid fa-barcode"></i></button></div></td></tr>`}).join('');
}
function phase6ToggleSelect(code,checked){checked?phase6State.selected.add(code):phase6State.selected.delete(code)}
function phase6SelectAll(checked){const q=String(document.getElementById('p6-search')?.value||'').trim().toLowerCase(),f=document.getElementById('p6-maint-filter')?.value||'ALL';phase6State.items.filter(x=>(f==='ALL'||x.maintenanceState===f)&&(!q||[x.equipmentCode,x.equipmentName,x.serialNumber].some(v=>String(v||'').toLowerCase().includes(q)))).forEach(x=>checked?phase6State.selected.add(x.equipmentCode):phase6State.selected.delete(x.equipmentCode));renderPhase6Table()}

async function openPhase6Profile(code){
    Swal.fire({title:'กำลังโหลดประวัติเครื่อง...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const r=await run('getEquipmentProfile',{equipmentCode:code}); if(!r.success){Swal.fire('ไม่สำเร็จ',r.error||'ไม่พบข้อมูล','error');return;} const p=r.data; phase6State.profile=p;
    const due=(p.maintenanceDue||[]).map(d=>{const [lab,cls]=p6StateMeta(d.state);return `<div class="p6-due-row"><div><b>${escapeHtml(d.planName)}</b><div class="text-xs text-gray-400">ทุก ${d.intervalMonths} เดือน${d.intervalBorrowCount?' หรือ '+d.intervalBorrowCount+' ครั้ง':''}</div></div><div class="text-right"><span class="p6-status ${cls}">${lab}</span><div class="text-xs mt-1">${p6Date(d.nextDueDate)}</div></div></div>`}).join('')||'<div class="text-gray-400 text-sm">ยังไม่มีแผนบำรุงรักษาสำหรับอุปกรณ์ประเภทนี้</div>';
    const history=(p.history||[]).slice(0,60).map(e=>`<div class="p6-timeline-row"><div class="p6-timeline-dot"></div><div><div class="flex gap-2 items-center flex-wrap"><b>${escapeHtml(e.title||e.event_type)}</b><span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full">${escapeHtml(e.event_type)}</span></div><div class="text-xs text-gray-400">${p6Date(e.event_at)}${e.detail?' • '+escapeHtml(e.detail):''}</div></div></div>`).join('')||'<div class="text-gray-400">ยังไม่มีประวัติ</div>';
    const meters=(p.meterReadings||[]).slice(0,5).map(m=>`<span class="inline-flex px-2 py-1 rounded-lg bg-sky-50 text-sky-700 text-xs mr-1 mb-1">${escapeHtml(m.meter_type)} ${Number(m.reading_value).toLocaleString()} • ${p6Date(m.reading_at)}</span>`).join('')||'-';
    const js=escapeJsSingleQuoted(code),[mlab,mcls]=p6StateMeta(p.maintenanceState);
    Swal.fire({width:980,title:`${escapeHtml(p.equipment.equipmentName)} • ${escapeHtml(code)}`,html:`<div class="text-left p6-profile"><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4"><div class="p6-mini"><span>สถานะ</span><b>${escapeHtml(p.equipment.status)}</b></div><div class="p6-mini"><span>ยืมสะสม</span><b>${Number(p.borrowCount||0)} ครั้ง</b></div><div class="p6-mini"><span>PM ถัดไป</span><b>${p6Date(p.nextMaintenanceDate)}</b></div><div class="p6-mini"><span>สุขภาพ PM</span><b class="${mcls}">${mlab}</b></div></div><div class="text-xs text-gray-500 mb-4">Serial: ${escapeHtml(p.equipment.serialNumber||'-')}<br>หมายเหตุสภาพ: ${escapeHtml(p.equipment.conditionNote||'-')}</div><h4 class="p6-section-title">รอบบำรุงรักษา</h4>${due}<h4 class="p6-section-title mt-4">ค่ามิเตอร์ล่าสุด</h4><div class="mb-4">${meters}</div><h4 class="p6-section-title">Timeline ประวัติเครื่อง</h4><div class="p6-timeline max-h-80 overflow-y-auto pr-2">${history}</div><div class="flex flex-wrap gap-2 mt-5"><button class="p6-btn" onclick="Swal.close();openPhase6Maintenance('${js}')"><i class="fa-solid fa-screwdriver-wrench"></i> บันทึก PM</button><button class="p6-btn" onclick="Swal.close();openPhase6Meter('${js}')"><i class="fa-solid fa-gauge"></i> บันทึกมิเตอร์</button><button class="p6-btn" onclick="Swal.close();openPhase6LabelDesigner('${js}')"><i class="fa-solid fa-barcode"></i> สติ๊กเกอร์</button></div></div>`,showConfirmButton:false,showCloseButton:true});
}

async function openPhase6Maintenance(code){
    const r=await run('getEquipmentProfile',{equipmentCode:code}); if(!r.success){Swal.fire('ไม่สำเร็จ',r.error,'error');return;} const p=r.data,plans=p.maintenancePlans||[];
    const options=['<option value="">งานบำรุงรักษาทั่วไป</option>',...plans.map(x=>`<option value="${x.id}">${escapeHtml(x.plan_name)}</option>`)].join('');
    const result=await Swal.fire({width:700,title:`บันทึกบำรุงรักษา • ${escapeHtml(code)}`,html:`<div class="p6-form text-left"><label>แผนบำรุงรักษา</label><select id="p6m-plan">${options}</select><label>วันที่ดำเนินการ</label><input id="p6m-date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>ผลการดำเนินงาน</label><select id="p6m-result"><option value="PASS">ผ่าน / พร้อมใช้</option><option value="FOLLOW_UP">ต้องติดตาม/ตรวจซ้ำ</option><option value="REPAIR">ส่งซ่อม</option><option value="OUT_OF_SERVICE">งดใช้งาน</option></select><div class="grid grid-cols-2 gap-2"><div><label>ผู้ดำเนินการ/ผู้ให้บริการ</label><input id="p6m-provider" placeholder="เจ้าหน้าที่ / บริษัท"></div><div><label>ชั่วโมงใช้งาน</label><input id="p6m-hours" type="number" min="0" step="0.1" placeholder="ถ้ามี"></div></div><div class="grid grid-cols-2 gap-2"><div><label>ค่าใช้จ่าย (บาท)</label><input id="p6m-cost" type="number" min="0" step="0.01"></div><div><label>กำหนดครั้งถัดไป</label><input id="p6m-next" type="date"><small class="text-gray-400">เว้นว่างให้ระบบคำนวณตามแผน</small></div></div><label>รายละเอียด / สิ่งที่ตรวจพบ</label><textarea id="p6m-note" rows="3" placeholder="เช่น ทำความสะอาด Filter ตรวจ Oxygen concentration 95%"></textarea></div>`,showCancelButton:true,confirmButtonText:'บันทึกประวัติ',cancelButtonText:'ยกเลิก',preConfirm:()=>({planId:document.getElementById('p6m-plan').value||null,performedAt:document.getElementById('p6m-date').value,result:document.getElementById('p6m-result').value,provider:document.getElementById('p6m-provider').value,meterHours:document.getElementById('p6m-hours').value,cost:document.getElementById('p6m-cost').value,nextDueDate:document.getElementById('p6m-next').value,note:document.getElementById('p6m-note').value})});
    if(!result.isConfirmed)return; Swal.fire({title:'กำลังบันทึก...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()}); const save=await run('recordEquipmentMaintenance',{equipmentCode:code,...result.value}); if(!save.success){Swal.fire('ไม่สำเร็จ',save.error,'error');return;} phase6State.loaded=false; await loadPhase6Dashboard(true); Swal.fire('บันทึกแล้ว',`PM ครั้งถัดไป: ${p6Date(save.nextDueDate)}`,'success');
}
async function openPhase6Meter(code){
    const result=await Swal.fire({title:`บันทึกค่ามิเตอร์ • ${escapeHtml(code)}`,html:`<div class="p6-form text-left"><label>ประเภทมิเตอร์</label><select id="p6r-type"><option value="HOURS">ชั่วโมงทำงาน (Hours)</option><option value="CYCLES">จำนวนรอบ (Cycles)</option><option value="OTHER">อื่น ๆ</option></select><label>ค่าที่อ่านได้</label><input id="p6r-value" type="number" min="0" step="0.1"><label>หมายเหตุ</label><input id="p6r-note"></div>`,showCancelButton:true,confirmButtonText:'บันทึก',preConfirm:()=>{const v=Number(document.getElementById('p6r-value').value);if(!Number.isFinite(v)||v<0){Swal.showValidationMessage('กรุณาระบุค่ามิเตอร์');return false}return {meterType:document.getElementById('p6r-type').value,readingValue:v,note:document.getElementById('p6r-note').value}}}); if(!result.isConfirmed)return; const r=await run('addEquipmentMeterReading',{equipmentCode:code,...result.value}); r.success?Swal.fire('บันทึกแล้ว','','success'):Swal.fire('ไม่สำเร็จ',r.error,'error');
}

async function openPhase6PlanManager(){
    const r=await run('getMaintenancePlans'); if(!r.success){Swal.fire('ไม่สำเร็จ',r.error,'error');return;} phase6State.plans=r.data||[];
    const rows=phase6State.plans.map(p=>`<tr><td class="p-2"><b>${escapeHtml(p.plan_name)}</b><div class="text-xs text-gray-400">${escapeHtml(p.plan_code)}</div></td><td class="p-2">${escapeHtml(p.equipment_name||'ทุกชนิด')}</td><td class="p-2 text-center">${p.interval_months} เดือน${p.interval_borrow_count?` / ${p.interval_borrow_count} ครั้ง`:''}</td><td class="p-2 text-right"><button class="p6-icon-btn" onclick="phase6EditPlan(${p.id})"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('');
    Swal.fire({width:850,title:'ตั้งค่ารอบบำรุงรักษา (PM)',html:`<div class="text-left"><div class="flex justify-end mb-2"><button class="p6-btn" onclick="phase6EditPlan(0)"><i class="fa-solid fa-plus"></i> เพิ่มแผน</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-gray-50"><th class="p-2 text-left">แผน</th><th class="p-2 text-left">ประเภทอุปกรณ์</th><th class="p-2">รอบ</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="p-5 text-center text-gray-400">ยังไม่มีแผน</td></tr>'}</tbody></table></div></div>`,showConfirmButton:false,showCloseButton:true});
}
async function phase6EditPlan(id){
