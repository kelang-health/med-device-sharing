    const html=`<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พิมพ์สติ๊กเกอร์ ${width}×${height} mm</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><style>@page{size:${width}mm ${height}mm;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Sarabun,Arial,sans-serif;background:#eee}.toolbar{position:sticky;top:0;background:#111827;color:white;padding:10px;text-align:center;z-index:9}.toolbar button{border:0;border-radius:8px;padding:9px 16px;font-weight:700}.sheet{width:${width}mm;height:${height}mm;background:white;margin:10px auto;overflow:hidden;page-break-after:always}.sheet:last-child{page-break-after:auto}.p6-label{width:100%;height:100%;padding:2mm;display:flex;flex-direction:column;overflow:hidden;color:#111;line-height:1.15;font-size:calc(9pt * var(--p6-font,1))}.p6-label-head{height:9mm;display:flex;align-items:center;gap:2mm}.p6-label-logo{width:8mm;height:8mm;object-fit:contain}.p6-label-agency{font-size:calc(7.5pt * var(--p6-font,1));line-height:1.1}.p6-label-agency small{display:block;font-size:.86em}.p6-label-name{font-weight:700;font-size:calc(12pt * var(--p6-font,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1mm}.p6-label-code{font-weight:700;font-size:calc(9pt * var(--p6-font,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p6-label-code span{font-weight:400;font-size:.85em}.p6-label-codes{display:flex;align-items:center;justify-content:space-between;gap:2mm;flex:1;min-height:0}.p6-barcode{width:45mm;max-height:16mm}.p6-qr img,.p6-qr canvas{width:16mm!important;height:16mm!important}.p6-label-foot{font-size:6.5pt;color:#555;text-align:right}@media print{body{background:white}.toolbar{display:none}.sheet{margin:0}}</style></head><body><div class="toolbar">ตัวอย่างก่อนพิมพ์ • ${width} × ${height} mm &nbsp; <button onclick="window.print()">พิมพ์</button></div>${labels.map(x=>`<div class="sheet">${x}</div>`).join('')}<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>window.addEventListener('load',()=>{document.querySelectorAll('.p6-barcode').forEach(el=>{if(el.style.display!=='none')JsBarcode(el,el.dataset.code||'',{format:'CODE128',displayValue:true,fontSize:11,height:32,margin:0})});document.querySelectorAll('.p6-qr').forEach(el=>{if(el.style.display!=='none')new QRCode(el,{text:el.dataset.qr||'',width:88,height:88,correctLevel:QRCode.CorrectLevel.M})})});<\/script></body></html>`;
