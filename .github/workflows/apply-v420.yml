name: Apply v4.2.0 LINE Rich Menu Manager
on:
  push:
    branches: [work/v4.2.0-rich-menu]
    paths:
      - 'tools/patch_v420.py'
      - '.github/workflows/apply-v420.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.2.0-rich-menu
      - name: Patch frontend
        run: python tools/patch_v420.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v4.2.0 LINE Rich Menu Manager' script.js
          grep -q 'style.css?v=4.2.0' index.html
          grep -q 'script.js?v=4.2.0' index.html
          grep -q 'line-rich-menu-manager' index.html
          grep -q 'createLineRichMenuFromUi' script.js
          grep -q 'v4.2.0 LINE Rich Menu Manager' style.css
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          git diff --cached --quiet && exit 0
          git commit -m 'v4.2.0: add LINE Rich Menu manager'
          git push origin HEAD:work/v4.2.0-rich-menu
