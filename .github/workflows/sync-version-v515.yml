name: Sync displayed version v5.1.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-version-v515.yml'
permissions:
  contents: write
jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync version strings
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('style.css?v=5.1.2','style.css?v=5.1.5')
          s=s.replace('ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.0 |','ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.5 |')
          s=s.replace('script.js?v=5.1.4','script.js?v=5.1.5')
          p.write_text(s,encoding='utf-8')

          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Backend v5.1.0','Backend v5.1.5')
          s=s.replace('โครงสร้างข้อมูลพร้อมใช้งาน v5.1.0','โครงสร้างข้อมูลพร้อมใช้งาน v5.1.5')
          s=s.replace('ตรวจสอบโครงสร้าง Supabase v5.1.0?','ตรวจสอบโครงสร้าง Supabase v5.1.5?')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check script.js
          grep -q 'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.5' index.html
          grep -q 'style.css?v=5.1.5' index.html
          grep -q 'script.js?v=5.1.5' index.html
          grep -q 'โครงสร้างข้อมูลพร้อมใช้งาน v5.1.5' script.js
          ! grep -q 'v5.1.0' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add index.html script.js
          git commit -m 'v5.1.5: synchronize visible version labels and cache keys'
          git push origin main
