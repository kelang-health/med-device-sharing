name: Apply v3.6 audit security

on:
  push:
    branches:
      - work/v3.6-audit-security
    paths:
      - .github/workflows/apply-v36.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.6-audit-security
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v36.py
      - name: Validate
        run: |
          node --check script.js
          git diff --check
          grep -q "v3.6 Audit & Security" script.js
          grep -q "VOID รายการยืม" script.js
          grep -q "LINE OA แจ้งเตือน" index.html
          grep -q "Audit Log" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "v3.6: add roles audit soft-delete and LINE readiness"
          git push origin HEAD:work/v3.6-audit-security
