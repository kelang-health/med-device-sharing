name: Apply v4.2.2 API Guard
on:
  push:
    branches: [work/v4.2.2-api-guard]
    paths:
      - 'tools/apply_v422.py'
      - '.github/workflows/apply-v422.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.2.2-api-guard
      - name: Patch frontend
        run: python tools/apply_v422.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v4.2.2 Backend Deployment Guard' script.js
          grep -q 'backendUnavailable' script.js
          grep -q 'script.js?v=4.2.2' index.html
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m 'v4.2.2: guard invalid Apps Script responses'
          git push origin HEAD:work/v4.2.2-api-guard
