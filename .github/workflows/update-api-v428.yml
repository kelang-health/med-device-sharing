name: Update frontend API v4.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-api-v428.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch frontend to new Apps Script deployment
        shell: python
        run: |
          from pathlib import Path

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbx-cuNjQYkHIT2CcJIrqbxmZjiCeCQLHcuKZNZFe7uM6-ZZo0_MfiGLYcX1pHHPoiiAfg/exec'
          new = 'https://script.google.com/macros/s/AKfycbwotdhnqLqGUXyzu5ljliz1Seb9g_s-KoQlJvufmegGgbo3ue77u1WbU1SY8VcJ4-a3OA/exec'
          if old not in s:
              raise SystemExit('Old API URL not found in script.js')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit API switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "v4.2.8: switch frontend to new Apps Script deployment"
          git push
