name: Apply v4.2.1 Rich Menu Button Hotfix
on:
  push:
    branches: [work/v4.2.1-rich-menu-button]
    paths:
      - 'tools/patch_v421.py'
      - '.github/workflows/apply-v421.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.2.1-rich-menu-button
      - name: Patch frontend
        run: python tools/patch_v421.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v4.2.1 Rich Menu Publish Button Hotfix' script.js
          grep -q 'script.js?v=4.2.1' index.html
          grep -q 'line-rm-publish-btn' index.html
          grep -q 'v4.2.1 Rich Menu publish button visibility hotfix' style.css
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          git diff --cached --quiet && exit 0
          git commit -m 'v4.2.1: fix Rich Menu publish button visibility'
          git push origin HEAD:work/v4.2.1-rich-menu-button
