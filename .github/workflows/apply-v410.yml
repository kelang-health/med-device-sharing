name: Apply v4.1.0 Backup Maintenance
on:
  push:
    branches: [work/v4.1.0-backup-maintenance]
    paths:
      - 'tools/apply_v410.py'
      - '.github/workflows/apply-v410.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.1.0-backup-maintenance
      - name: Patch frontend
        run: python tools/apply_v410.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v4.1.0 Backup & Log Maintenance' script.js
          grep -q 'script.js?v=4.1.0' index.html
          grep -q 'maintenance-status' index.html
          grep -q 'loadMaintenanceStatus' script.js
          grep -q 'TRASH ORPHANS' script.js
          grep -q 'DELETE ARCHIVE' script.js
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m 'v4.1.0: backup and log maintenance'
          git push origin HEAD:work/v4.1.0-backup-maintenance
