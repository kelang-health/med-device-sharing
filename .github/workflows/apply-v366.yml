name: Apply v3.6.6 guided LINE setup

on:
  push:
    branches:
      - work/v3.6.6-line-setup
    paths:
      - .github/workflows/apply-v366.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.6.6-line-setup
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v366.py
      - name: Validate
        run: |
          node --check script.js
          git diff --check
          grep -q "style.css?v=3.6.6" index.html
          grep -q "script.js?v=3.6.6" index.html
          grep -q "v3.6.6" script.js
          grep -q "ตั้งค่าครั้งแรก 2 ระยะ" index.html
          grep -q "Target ID สามารถเว้นว่างในครั้งแรกได้" script.js
          grep -q "background:#059669" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m "v3.6.6: guided LINE setup and visible save action"
          git push origin HEAD:work/v3.6.6-line-setup
# trigger
