name: Run missing image recovery patch v5.1.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-patch-missing-image-v515.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_missing_image_v515.py
      - run: node --check script.js
      - run: grep -q "v5.1.5 Missing Image Recovery" script.js
      - run: grep -q "replaceUnavailableBorrowImage" script.js
      - run: grep -q "script.js?v=5.1.5" index.html
      - run: git diff --check
      - run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add script.js index.html
          git commit -m "v5.1.5: add unrecoverable legacy image replacement flow"
          git push origin main
