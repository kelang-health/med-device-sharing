name: Apply v4.0.0 Procurement Accessibility
on:
  push:
    branches: [work/v4.0.0-procurement-accessibility]
    paths:
      - 'tools/apply_v400.py'
      - '.github/workflows/apply-v400.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.0.0-procurement-accessibility
      - name: Patch frontend
        run: python tools/apply_v400.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v4.0.0 Procurement Planning & Accessibility' script.js
          grep -q 'script.js?v=4.0.0' index.html
          grep -q 'btn-menu-procurement' index.html
          grep -q 'font-scale-control' index.html
          grep -q 'loadProcurementPlan' script.js
          grep -q 'font-scale' style.css
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          git diff --cached --quiet && exit 0
          git commit -m 'v4.0.0: procurement planning and font scaling'
          git push origin HEAD:work/v4.0.0-procurement-accessibility
