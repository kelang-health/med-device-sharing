name: Harden v4.1.1 Frontend
on:
  push:
    branches: [work/v4.1.1-stabilization]
    paths:
      - 'tools/harden_v411b.py'
      - '.github/workflows/harden-v411b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.1.1-stabilization
      - run: python tools/harden_v411b.py
      - run: node --check script.js
      - run: git diff --check
      - name: Verify hardening markers
        run: |
          grep -q 'escapeJsSingleQuoted' script.js
          grep -q 'getBorrowImage' script.js
          grep -q 'secureBorrowImagesUi' script.js
          grep -q 'Spreadsheet + รูปหลักฐาน' script.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'v4.1.1: harden dynamic UI output'
          git push origin HEAD:work/v4.1.1-stabilization