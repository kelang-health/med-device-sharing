name: Smartphone responsive UX v5.1.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-smartphone-v519.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smartphone patch helper
        run: python tools/patch_mobile_v519.py
      - name: Validate source
        run: |
          node --check script.js
          grep -q 'v5.1.9 Smartphone Responsive UX' script.js
          grep -q 'function closeMobileSidebar' script.js
          grep -q 'mobile-sidebar-backdrop' index.html
          grep -q 'viewport-fit=cover' index.html
          grep -q 'smartphone responsive v5.1.9' style.css
          grep -q 'script.js?v=5.1.9' index.html
          grep -q 'style.css?v=5.1.9' index.html
          grep -q 'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.9' index.html
          git diff --check
      - name: Commit mobile upgrade
        run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add index.html script.js style.css
          git commit -m 'v5.1.9: optimize interface for smartphones'
          git push origin main
