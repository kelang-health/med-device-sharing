name: Apply v3.9.0 Management Analytics
on:
  push:
    branches: [work/v3.9.0-management-analytics]
    paths:
      - 'tools/apply_v390.py'
      - '.github/workflows/apply-v390.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.9.0-management-analytics
      - name: Patch frontend
        run: python tools/apply_v390.py
      - name: Normalize generated analytics menu whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<i class="fa-solid fa-chart-line text-lg text-violet-500 w-6 text-center"></i> \n','<i class="fa-solid fa-chart-line text-lg text-violet-500 w-6 text-center"></i>\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v3.9.0 Management Analytics' script.js
          grep -q 'script.js?v=3.9.0' index.html
          grep -q 'sec-analytics' index.html
          grep -q 'loadManagementAnalytics' script.js
          grep -q 'getManagementAnalytics' script.js
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m 'v3.9.0: management analytics dashboard'
          git push origin HEAD:work/v3.9.0-management-analytics
