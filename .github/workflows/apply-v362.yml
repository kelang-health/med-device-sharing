name: Apply v3.6.2 LINE webhook

on:
  push:
    branches:
      - work/v3.6.2-line-webhook
    paths:
      - .github/workflows/apply-v362.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.6.2-line-webhook
          fetch-depth: 0
      - name: Apply frontend patch
        run: python3 tools/apply_v362.py
      - name: Validate
        run: |
          node --check script.js
          git diff --check
          grep -q "v3.6.2 LINE Webhook" script.js
          grep -q "line-channel-secret" index.html
          grep -q "line-webhook-gateway" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "v3.6.2: add secure LINE webhook settings"
          git push origin HEAD:work/v3.6.2-line-webhook
