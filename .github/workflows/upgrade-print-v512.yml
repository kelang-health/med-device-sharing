name: Upgrade Print Receipt v5.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-print-v512.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply print patch
        run: |
          python tools/patch_print_v512.py
          node --check script.js
      - name: Verify print structure
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          j=Path('script.js').read_text(encoding='utf-8')
          c=Path('style.css').read_text(encoding='utf-8')
          ids=['print-logo','print-entry-id','print-date','print-borrower','print-citizen','print-phone','print-patient','print-relation','print-community','print-address','print-equipment','print-start-date','print-end-date','print-deposit','print-note','print-sign-borrower','print-sign-staff']
          for x in ids:
              assert h.count('id="'+x+'"')==1, x
          assert 'script.js?v=5.1.2' in h and 'style.css?v=5.1.2' in h
          assert 'size:A4 portrait' in c
          assert 'body.print-mode-receipt #print-tracking-section{ display:none !important; }' in c
          assert 'body.print-mode-tracking #print-section{ display:none !important; }' in c
          assert "setText('print-address'" in j and "setText('print-community'" in j
          assert 'window.print();' in j and 'DEFAULT_LOGO' in j
          print('print structure passed')
          PY
      - name: Verify logo asset
        run: |
          code=$(curl -L -sS --max-time 30 -o /tmp/logo.png -w '%{http_code}' 'https://kelang-health.github.io/med-device-sharing/assets/logo.png?v=4.2.4')
          test "$code" = 200
          test -s /tmp/logo.png
          file /tmp/logo.png | grep -qi 'PNG image data'
      - name: Commit upgrade
        run: |
          git config user.name 'kelang-health'
          git config user.email 'mithong3@gmail.com'
          git add script.js index.html style.css
          git diff --cached --check
          git commit -m 'v5.1.2: align A4 loan receipt and harden logo printing'
          git push origin main
