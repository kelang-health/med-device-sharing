name: Apply v3.8.0 Equipment Lifecycle
on:
  push:
    branches: [work/v3.8.0-equipment-lifecycle]
    paths:
      - 'tools/apply_v380.py'
      - '.github/workflows/apply-v380.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.8.0-equipment-lifecycle
      - name: Repair patcher newline literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v380.py')
          s=p.read_text(encoding='utf-8')
          a="js,n=re.subn(pat,new_return,js,count=1,flags=re.S)"
          b="new_return = new_return.replace(r'\\n', '\\n')\njs,n=re.subn(pat,new_return,js,count=1,flags=re.S)"
          c="js=js.replace(needle,lifecycle_func+needle,1)"
          d="lifecycle_func = lifecycle_func.replace(r'\\n', '\\n')\njs=js.replace(needle,lifecycle_func+needle,1)"
          if a not in s or c not in s:
              raise SystemExit('patcher repair markers missing')
          s=s.replace(a,b,1).replace(c,d,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Patch frontend
        run: python tools/apply_v380.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify markers
        run: |
          grep -q 'v3.8.0 Equipment Lifecycle' script.js
          grep -q 'script.js?v=3.8.0' index.html
          grep -q 'openEquipmentLifecyclePrompt' script.js
          grep -q 'ReturnCondition' script.js
          grep -q 'line-event-eq-status' index.html
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m 'v3.8.0: equipment lifecycle and return condition workflow'
          git push origin HEAD:work/v3.8.0-equipment-lifecycle
