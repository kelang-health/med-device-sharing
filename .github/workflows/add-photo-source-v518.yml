name: Add upload or camera source v5.1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-photo-source-v518.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch helper
        run: python tools/patch_photo_source_v518.py
      - name: Validate
        run: |
          node --check script.js
          grep -q 'v5.1.8 Photo Source Choice' script.js
          grep -q 'function openBorrowPhotoSource' script.js
          grep -q 'borrow-photo-upload-input' index.html
          grep -q 'borrow-photo-camera-input' index.html
          grep -q '>อัปโหลดรูป<' index.html
          grep -q '>ถ่ายภาพ<' index.html
          grep -q 'script.js?v=5.1.8' index.html
          grep -q 'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.8' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add index.html script.js
          git commit -m 'v5.1.8: add upload or camera choice for borrow evidence'
          git push origin main
