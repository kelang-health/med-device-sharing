name: Apply v4.1.1 Stabilization
on:
  push:
    branches: [work/v4.1.1-stabilization]
    paths:
      - 'tools/apply_v411.py'
      - '.github/workflows/apply-v411.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v4.1.1-stabilization
      - name: Patch frontend
        run: python tools/apply_v411.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Validate diff
        run: git diff --check
      - name: Verify security markers
        run: |
          grep -q 'v4.1.1 Stabilization & Safety Fix' script.js
          grep -q 'script.js?v=4.1.1' index.html
          grep -q 'usage-seg-unavailable' index.html
          grep -q 'getBorrowImage' script.js
          grep -q 'secureBorrowImagesUi' script.js
          grep -q 'Backend v4.1.1' script.js
          ! grep -q 'โครงสร้างข้อมูลพร้อมใช้งาน v3.8.0' script.js
      - name: Commit frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          git diff --cached --quiet && exit 0
          git commit -m 'v4.1.1: stabilize lifecycle backup and image security'
          git push origin HEAD:work/v4.1.1-stabilization
