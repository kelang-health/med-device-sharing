name: Update frontend API to v4.2.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-api-v427.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Apps Script API and cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_api = 'https://script.google.com/macros/s/AKfycbzPHiANxxUEHUoAKyK1hHfGWuZN_ihkI8xQ3WXkLyPFG5DDONW5limoB-h6egfOsNKgzA/exec'
          new_api = 'https://script.google.com/macros/s/AKfycbx-cuNjQYkHIT2CcJIrqbxmZjiCeCQLHcuKZNZFe7uM6-ZZo0_MfiGLYcX1pHHPoiiAfg/exec'

          script = Path('script.js')
          s = script.read_text(encoding='utf-8')
          if old_api not in s:
              raise SystemExit('Old API_URL not found in script.js')
          s = s.replace(old_api, new_api, 1)
          s = s.replace('v4.2.6 Secure Image Preview Fix', 'v4.2.7 Backend API Update', 1)
          script.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('style.css?v=4.2.6', 'style.css?v=4.2.7')
          h = h.replace('script.js?v=4.2.6', 'script.js?v=4.2.7')
          h = h.replace('v4.2.6', 'v4.2.7')
          index.write_text(h, encoding='utf-8')
          PY

      - name: Verify changes
        shell: bash
        run: |
          grep -F "AKfycbx-cuNjQYkHIT2CcJIrqbxmZjiCeCQLHcuKZNZFe7uM6-ZZo0_MfiGLYcX1pHHPoiiAfg/exec" script.js
          grep -F "v4.2.7" index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git commit -m "v4.2.7: switch frontend to new Apps Script deployment"
          git push
