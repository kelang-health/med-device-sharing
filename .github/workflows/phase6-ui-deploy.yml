name: Phase 6 UI integration
on:
  push:
    paths:
      - '.github/workflows/phase6-ui-deploy.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase 6 into frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')

          if 'phase6.css?v=6.0.0' not in s:
              s=s.replace('</head>', '    <link rel="stylesheet" href="phase6.css?v=6.0.0" />\n</head>')

          menu='''                <button onclick="openLifecycleTab()" id="btn-menu-lifecycle" class="menu-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-all">\n                    <i class="fa-solid fa-screwdriver-wrench text-lg text-emerald-600 w-6 text-center"></i>\n                    <span class="menu-text transition-all duration-200">ประวัติ / บำรุงรักษา</span>\n                </button>\n'''
          if 'id="btn-menu-lifecycle"' not in s:
              needle='                <button onclick="switchTab(\'tracking\')" id="btn-menu-tracking"'
              pos=s.find(needle)
              if pos<0: raise SystemExit('tracking menu anchor not found')
              s=s[:pos]+menu+s[pos:]

          section='''            <section id="sec-lifecycle" class="app-view space-y-6 hidden">\n                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 print:hidden">\n                    <div>\n                        <h3 class="text-base font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-screwdriver-wrench text-emerald-600"></i> ทะเบียนประวัติและบำรุงรักษาอุปกรณ์</h3>\n                        <p class="text-xs text-gray-400 mt-1">Equipment Lifecycle · Preventive Maintenance · Barcode / QR · สติ๊กเกอร์ 75×50 mm</p>\n                    </div>\n                    <div class="flex flex-wrap gap-2">\n                        <button onclick="loadPhase6Lifecycle(true)" class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-3 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-rotate mr-1"></i> รีเฟรช</button>\n                        <button onclick="openMaintenancePlanManager()" class="admin-role-only bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-calendar-check mr-1"></i> แผน PM</button>\n                    </div>\n                </div>\n                <div class="p6-kpis">\n                    <div class="p6-kpi"><span>อุปกรณ์ทั้งหมด</span><b id="p6-kpi-total">0</b></div>\n                    <div class="p6-kpi"><span>PM เกินกำหนด</span><b id="p6-kpi-overdue">0</b></div>\n                    <div class="p6-kpi"><span>ครบใน 30 วัน</span><b id="p6-kpi-soon">0</b></div>\n                    <div class="p6-kpi"><span>ครบตามการใช้งาน</span><b id="p6-kpi-usage">0</b></div>\n                    <div class="p6-kpi"><span>ยังไม่มีแผน PM</span><b id="p6-kpi-noplan">0</b></div>\n                </div>\n                <div class="p6-section-card p6-toolbar print:hidden">\n                    <input id="p6-search" type="search" oninput="renderPhase6Lifecycle()" placeholder="ค้นหารหัส ชื่ออุปกรณ์ หรือ Serial">\n                    <select id="p6-state-filter" onchange="renderPhase6Lifecycle()">\n                        <option value="all">สถานะ PM ทั้งหมด</option>\n                        <option value="OVERDUE">เกินกำหนด</option>\n                        <option value="DUE_SOON">ใกล้ครบ 30 วัน</option>\n                        <option value="DUE_USAGE">ครบตามจำนวนใช้งาน</option>\n                        <option value="OK">ปกติ</option>\n                        <option value="NO_PLAN">ยังไม่มีแผน</option>\n                    </select>\n                    <span class="text-xs text-gray-400">กด “ประวัติ” เพื่อดู Timeline · “บำรุง” เพื่อบันทึก PM · “สติ๊กเกอร์” เพื่อพิมพ์ Barcode/QR</span>\n                </div>\n                <div id="phase6-equipment-list"><div class="p6-loading">เปิดเมนูเพื่อประมวลข้อมูล</div></div>\n            </section>\n\n'''
          if 'id="sec-lifecycle"' not in s:
              needle='            <section id="sec-tracking"'
              pos=s.find(needle)
              if pos<0: raise SystemExit('tracking section anchor not found')
              s=s[:pos]+section+s[pos:]

          if 'phase6.js?v=6.0.0' not in s:
              s=s.replace('</body>', '    <script src="phase6.js?v=6.0.0"></script>\n</body>')

          s=re.sub(r'script\.js\?v=[0-9.]+', 'script.js?v=6.0.0', s)
          s=re.sub(r'style\.css\?v=[0-9.]+', 'style.css?v=6.0.0', s)
          s=re.sub(r'(ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ )v[0-9.]+', r'\1v6.0.0', s)
          idx.write_text(s,encoding='utf-8')

          js=Path('script.js')
          j=js.read_text(encoding='utf-8')
          j=j.replace('https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api-v52','https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api-v60')
          j=re.sub(r'Frontend Controller API \([^\n]*\)', 'Frontend Controller API (v6.0.0 Equipment Lifecycle & Maintenance)', j, count=1)
          js.write_text(j,encoding='utf-8')
          PY
          node --check script.js
          node --check phase6.js
          grep -q 'med-device-api-v60' script.js
          grep -q 'sec-lifecycle' index.html
          grep -q 'equipment-label.html' phase6.js
          git diff --check
      - name: Commit Phase 6 frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v6.0.0: integrate equipment lifecycle maintenance and label printing"
          git push
