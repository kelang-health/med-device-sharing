name: Apply v3.7.0 LINE automation

on:
  push:
    branches:
      - work/v3.7-line-automation
    paths:
      - .github/workflows/apply-v370.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.7-line-automation
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v370.py
      - name: Validate
        run: |
          node --check script.js
          git diff --check
          grep -q "style.css?v=3.7.0" index.html
          grep -q "script.js?v=3.7.0" index.html
          grep -q "line-event-borrow" index.html
          grep -q "line-daily-hour" index.html
          grep -q "collectLineEventPreferences" script.js
          grep -q "setupLineDailyTrigger" script.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m "v3.7.0: configurable LINE event alerts and daily schedule"
          git push origin HEAD:work/v3.7-line-automation
