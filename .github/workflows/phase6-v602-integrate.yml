name: Phase 6 v6.0.2 integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase6-v602-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Phase 6.0.2 frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'phase6-enhance.css' not in s:
              s=s.replace('</head>','    <link rel="stylesheet" href="phase6-enhance.css?v=6.0.2" />\n</head>',1)
          if 'phase6-enhance.js' not in s:
              anchor='<script src="phase6-mobile.js?v=6.0.1"></script>'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n    <script src="phase6-enhance.js?v=6.0.2"></script>',1)
              else:
                  s=s.replace('</body>','    <script src="phase6-enhance.js?v=6.0.2"></script>\n</body>',1)
          s=re.sub(r'script\.js\?v=[0-9.]+','script.js?v=6.0.2',s)
          s=re.sub(r'phase6\.js\?v=[0-9.]+','phase6.js?v=6.0.2',s)
          s=re.sub(r'phase6-mobile\.js\?v=[0-9.]+','phase6-mobile.js?v=6.0.2',s)
          s=re.sub(r'phase6\.css\?v=[0-9.]+','phase6.css?v=6.0.2',s)
          s=re.sub(r'phase6-enhance\.css\?v=[0-9.]+','phase6-enhance.css?v=6.0.2',s)
          s=re.sub(r'phase6-enhance\.js\?v=[0-9.]+','phase6-enhance.js?v=6.0.2',s)
          s=re.sub(r'(ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ )v[0-9.]+',r'\1v6.0.2',s)
          p.write_text(s,encoding='utf-8')

          js=Path('script.js')
          j=js.read_text(encoding='utf-8')
          j=re.sub(r'Frontend Controller API \([^\n]*\)','Frontend Controller API (v6.0.2 Equipment Lifecycle & Barcode)',j,count=1)
          js.write_text(j,encoding='utf-8')

          lp=Path('equipment-label.html')
          l=lp.read_text(encoding='utf-8')
          if 'equipment-label-enhance.js' not in l:
              l=l.replace('</body>','<script src="equipment-label-enhance.js?v=6.0.2"></script>\n</body>',1)
          else:
              l=re.sub(r'equipment-label-enhance\.js\?v=[0-9.]+','equipment-label-enhance.js?v=6.0.2',l)
          lp.write_text(l,encoding='utf-8')
          PY
      - name: Validate JavaScript and integration
        run: |
          node --check script.js
          node --check phase6.js
          node --check phase6-mobile.js
          node --check phase6-enhance.js
          node --check equipment-label-enhance.js
          grep -q 'med-device-api-v60' script.js
          grep -q 'phase6-enhance.js?v=6.0.2' index.html
          grep -q 'phase6-enhance.css?v=6.0.2' index.html
          grep -q 'equipment-label-enhance.js?v=6.0.2' equipment-label.html
          grep -q 'v6.0.2 | Design & Developed' index.html
          git diff --check
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js equipment-label.html
          git commit -m 'v6.0.2: complete Phase 6 PM checklist scan and label printing'
          git push
