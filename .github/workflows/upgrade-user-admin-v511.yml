name: Upgrade User Administration v5.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-user-admin-v511.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add role management and self password change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,base64
          s=Path('script.js').read_text(encoding='utf-8')
          pattern=r"function renderAdminUsersTable\(users\) \{.*?\nfunction openAddAdminUserModal\(\) \{"
          replacement=base64.b64decode('').decode('utf-8')
          ns,n=re.subn(pattern,lambda m:replacement,s,flags=re.S)
          assert n==1, f'user admin block replacement count={n}'
          Path('script.js').write_text(ns,encoding='utf-8')
          h=Path('index.html'); i=h.read_text(encoding='utf-8')
          i=i.replace('เพิ่มหรือลบบัญชีเจ้าหน้าที่ที่สามารถเข้าสู่ระบบจัดการหลังบ้านได้','เพิ่ม เปิด/ปิด และเปลี่ยนสิทธิ์ ADMIN/STAFF; บัญชีของตนเองสามารถเปลี่ยนรหัสผ่านได้')
          i=i.replace('script.js?v=5.1.0','script.js?v=5.1.1')
          h.write_text(i,encoding='utf-8')
          PY
          node --check script.js
          git config user.name 'kelang-health'
          git config user.email 'mithong3@gmail.com'
          git add script.js index.html
          git diff --cached --check
          git commit -m 'v5.1.1: complete user role and password administration'
          git push origin main
