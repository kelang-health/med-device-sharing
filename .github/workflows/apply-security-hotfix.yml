name: Apply frontend security hotfix

on:
  push:
    branches:
      - work/security-hotfix
    paths:
      - .github/workflows/apply-security-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: work/security-hotfix
          fetch-depth: 0

      - name: Apply targeted frontend patch
        run: python3 tools/apply_security_hotfix.py

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate diff
        run: git diff --check && git diff -- script.js

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "Security hotfix: protect public PII and validate sessions"
          git push origin HEAD:work/security-hotfix
