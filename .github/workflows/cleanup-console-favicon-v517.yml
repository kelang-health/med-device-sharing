name: Cleanup favicon and legacy image console v5.1.7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-console-favicon-v517.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v5.1.6 Legacy Image State','v5.1.7 Console Hygiene',1)
          old="if(isLegacyImageUnavailableError(msg)) console.info('รูปหลักฐานเก่าไม่มีไฟล์หลัง migration',{fileId:id}); else console.warn('โหลดรูปหลักฐานไม่สำเร็จ',{fileId:id,response:r});"
          new="if(!isLegacyImageUnavailableError(msg)) console.warn('โหลดรูปหลักฐานไม่สำเร็จ',{fileId:id,response:r});"
          if old not in s:
              raise SystemExit('legacy console anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace('style.css?v=5.1.6','style.css?v=5.1.7')
          h=h.replace('script.js?v=5.1.6','script.js?v=5.1.7')
          h=h.replace('ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.6 |','ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.7 |')
          if 'rel="icon"' not in h:
              h=h.replace('<title>ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์</title>', '<title>ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์</title>\n    <link rel="icon" type="image/png" href="assets/logo.png?v=5.1.7" />',1)
          else:
              import re
              h=re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" href="assets/logo.png?v=5.1.7" />', h, count=1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check script.js
          grep -q 'v5.1.7 Console Hygiene' script.js
          grep -q 'script.js?v=5.1.7' index.html
          grep -q 'style.css?v=5.1.7' index.html
          grep -q 'rel="icon" type="image/png" href="assets/logo.png?v=5.1.7"' index.html
          grep -q 'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.7' index.html
          ! grep -q 'รูปหลักฐานเก่าไม่มีไฟล์หลัง migration' script.js
          git diff --check
      - name: Commit
        run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add script.js index.html
          git commit -m 'v5.1.7: add favicon and suppress expected legacy image console noise'
          git push origin main
