name: Test Supabase API v5.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-supabase-api-v500.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test health and public API
        shell: bash
        run: |
          set -euo pipefail
          API='https://txjuiaiwffsxfcrxpkvd.supabase.co/functions/v1/med-device-api'
          curl -fsSL --max-time 30 "$API?action=health" -o health.json
          cat health.json
          python - <<'PY'
          import json
          d=json.load(open('health.json'))
          assert d.get('success') is True, d
          assert d.get('backend')=='supabase', d
          assert d.get('version')=='5.0.0', d
          PY
          curl -fsSL --max-time 30 -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"getPublicDashboard","payload":{}}' "$API" -o dash.json
          cat dash.json
          python - <<'PY'
          import json
          d=json.load(open('dash.json'))
          assert d.get('success') is True, d
          x=d.get('data') or {}
          assert x.get('total')==117, x
          assert x.get('borrowed')==56, x
          assert x.get('available')==61, x
          PY
          curl -fsSL --max-time 30 -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"getData","payload":{"sheetName":"Equipments"}}' "$API" -o eq.json
          python - <<'PY'
          import json
          d=json.load(open('eq.json'))
          assert d.get('success') is True, d
          assert len(d.get('data') or [])==117, len(d.get('data') or [])
          print('public API smoke passed')
          PY
