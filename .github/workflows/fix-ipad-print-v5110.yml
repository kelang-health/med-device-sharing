name: Fix iPad Safari print v5.1.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ipad-print-v5110.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run iPad print patch helper
        run: python tools/patch_ipad_print_v5110.py
      - name: Validate
        run: |
          node --check script.js
          grep -q 'v5.1.10 iPad Safari Print Fix' script.js
          grep -q 'iPad/iPhone Safari may return' script.js
          grep -q 'script.js?v=5.1.10' index.html
          grep -q 'style.css?v=5.1.10' index.html
          grep -q 'ระบบบริหารจัดการยืมคืนอุปกรณ์การแพทย์ v5.1.10' index.html
          git diff --check
      - name: Commit fix
        run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add index.html script.js
          git commit -m 'v5.1.10: keep print DOM alive for iPad Safari preview'
          git push origin main
