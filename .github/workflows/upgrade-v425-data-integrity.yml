name: One-shot v4.2.5 data integrity upgrade

on:
  push:
    paths:
      - '.github/workflows/upgrade-v425-data-integrity.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v4.2.5 frontend integrity safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Frontend Controller API (v4.2.4 Logo/Print Stability)', 'Frontend Controller API (v4.2.5 Data Integrity & Security)')
          s = s.replace("state.role = res.role || getSessionValue('role') || 'ADMIN';", "state.role = res.role || getSessionValue('role') || 'STAFF';")
          old = "        if (state.isAdmin) {\n            const resLog = await run('getData', { sheetName: 'BorrowLog' });\n            if (resLog.success) state.data = resLog.data || [];\n        } else {"
          new = "        if (state.isAdmin) {\n            const resLog = await run('getData', { sheetName: 'BorrowLog' });\n            if (resLog.success) {\n                state.data = resLog.data || [];\n                if (state.role === 'ADMIN') {\n                    const borrowedSet = getBorrowedEquipmentIdSet();\n                    const mismatch = state.equipments.some(eq => {\n                        const id = String(eq.EquipmentID || eq[0] || '').trim();\n                        const stored = String(eq.Status || eq[3] || 'Available').trim();\n                        return borrowedSet.has(id) !== ['Borrowed','ยืม'].includes(stored);\n                    });\n                    if (mismatch) {\n                        const synced = await run('syncEquipmentStatus', {});\n                        if (synced && synced.success) {\n                            const refreshedEq = await run('getData', { sheetName: 'Equipments' });\n                            if (refreshedEq && refreshedEq.success) state.equipments = refreshedEq.data || [];\n                        } else {\n                            console.warn('Data integrity auto-sync failed:', synced && synced.error ? synced.error : 'unknown');\n                        }\n                    }\n                }\n            }\n        } else {"
          if old not in s:
              raise SystemExit('loadSystemData hook not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace('style.css?v=4.2.3', 'style.css?v=4.2.5')
          h = h.replace('script.js?v=4.2.4', 'script.js?v=4.2.5')
          h = h.replace('v4.2.4 | Design & Developed', 'v4.2.5 | Design & Developed')
          old_citizen = 'id="borrow-citizen" maxlength="13" class="w-full border border-gray-200 px-3 py-2 rounded-xl focus:outline-none" required'
          new_citizen = 'id="borrow-citizen" maxlength="13" inputmode="numeric" pattern="[0-9]{13}" autocomplete="off" class="w-full border border-gray-200 px-3 py-2 rounded-xl focus:outline-none" required'
          old_phone = 'id="borrow-phone" maxlength="10" class="w-full border border-gray-200 px-3 py-2 rounded-xl focus:outline-none" required'
          new_phone = 'id="borrow-phone" maxlength="10" inputmode="tel" pattern="[0-9]{10}" autocomplete="tel" class="w-full border border-gray-200 px-3 py-2 rounded-xl focus:outline-none" required'
          if old_citizen in h:
              h = h.replace(old_citizen, new_citizen, 1)
          if old_phone in h:
              h = h.replace(old_phone, new_phone, 1)
          p.write_text(h, encoding='utf-8')
          PY

      - name: Verify v4.2.5 patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Frontend Controller API (v4.2.5 Data Integrity & Security)' script.js
          grep -Fq "getSessionValue('role') || 'STAFF'" script.js
          grep -Fq "run('syncEquipmentStatus', {})" script.js
          grep -Fq 'style.css?v=4.2.5' index.html
          grep -Fq 'script.js?v=4.2.5' index.html
          grep -Fq 'v4.2.5 | Design & Developed' index.html
          grep -Fq 'pattern="[0-9]{13}"' index.html
          grep -Fq 'pattern="[0-9]{10}"' index.html

      - name: Commit v4.2.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'v4.2.5: harden data integrity and role fallback'
          git push origin HEAD:main
