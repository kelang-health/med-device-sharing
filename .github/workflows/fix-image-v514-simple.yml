name: Fix image v5.1.4
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-image-v514-simple.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_image_v514.py
      - run: node --check script.js
      - run: grep -q "script.js?v=5.1.4" index.html
      - run: git diff --check
      - run: |
          git config user.name kelang-health
          git config user.email mithong3@gmail.com
          git add script.js index.html
          git commit -m "v5.1.4 secure image signed URL refresh"
          git push origin main
