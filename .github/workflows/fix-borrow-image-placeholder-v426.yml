name: One-shot v4.2.6 borrow image placeholder fix

on:
  push:
    paths:
      - '.github/workflows/fix-borrow-image-placeholder-v426.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix secure borrow image placeholder HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')

          old = '''    const placeholder='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140"><rect width="100%" height="100%" fill="%23f1f5f9"/><text x="50%" y="52%" text-anchor="middle" fill="%2394a3b8" font-size="14">loading...</text></svg>';'''
          new = '''    const placeholder='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="52%" text-anchor="middle" fill="#94a3b8" font-size="14">loading...</text></svg>');'''

          if old not in s:
              raise SystemExit('placeholder line not found')
          s = s.replace(old, new, 1)
          s = s.replace('Frontend Controller API (v4.2.5 Data Integrity & Security)', 'Frontend Controller API (v4.2.6 Secure Image Preview Fix)', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace('style.css?v=4.2.5', 'style.css?v=4.2.6')
          h = h.replace('script.js?v=4.2.5', 'script.js?v=4.2.6')
          h = h.replace('v4.2.5 | Design & Developed', 'v4.2.6 | Design & Developed')
          p.write_text(h, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\"" script.js
          grep -Fq 'Frontend Controller API (v4.2.6 Secure Image Preview Fix)' script.js
          grep -Fq 'script.js?v=4.2.6' index.html
          grep -Fq 'style.css?v=4.2.6' index.html
          grep -Fq 'v4.2.6 | Design & Developed' index.html

      - name: Commit v4.2.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'v4.2.6: fix secure borrow image placeholder rendering'
          git push origin HEAD:main
