name: Apply v3.6.4 LINE POST cache hotfix

on:
  push:
    branches:
      - work/v3.6.4-line-post-cache
    paths:
      - .github/workflows/apply-v364.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v3.6.4-line-post-cache
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v364.py
      - name: Validate
        run: |
          node --check script.js
          git diff --check
          grep -q "style.css?v=3.6.4" index.html
          grep -q "script.js?v=3.6.4" index.html
          grep -q "v3.6.4" script.js
          grep -q "พบไฟล์หน้าเว็บรุ่นเก่าใน Cache" script.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m "v3.6.4: force fresh POST frontend for LINE tests"
          git push origin HEAD:work/v3.6.4-line-post-cache
